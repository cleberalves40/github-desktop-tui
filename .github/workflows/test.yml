name: build-and-test

on:
  push:
  pull_request:

jobs:
  freebsd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["14.5", "15.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          prepare: pkg install -y cmake ninja ftxui git gh
          run: |
            cmake -S . -B build-clean -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build-clean
            ctest --test-dir build-clean --output-on-failure
            ./build-clean/github-desktop-tui --version

  homebrew-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake ninja ftxui git gh
      - run: brew style Formula/github-desktop-tui.rb
      - run: brew install --build-from-source ./Formula/github-desktop-tui.rb
      - run: brew test ./Formula/github-desktop-tui.rb
      - run: cmake -S . -B build-clean -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-clean
      - run: ctest --test-dir build-clean --output-on-failure
      - run: ./build-clean/github-desktop-tui --version